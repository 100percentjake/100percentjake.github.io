<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10151d">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
          <span class="brand-mark">100%</span>
          <span class="brand-name">jake</span>
        </a>
        <p class="tagline">{{ site.description }}</p>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Journal</a>
          <a href="https://github.com/100percentjake">GitHub</a>
        </nav>
      </div>
    </header>

    <main id="content" class="page-shell">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>© {{ 'now' | date: '%Y' }} {{ site.author }}. Built with Jekyll and a questionable quantity of old hardware.</p>
    </footer>
  </body>
</html>
